<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices | Computer Geeks Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05100B">
<link rel="icon" href="/assets/images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body>
<header class="masthead admin-bar">
  <div class="wrap bar">
    <a class="brand" href="/"><img src="/assets/images/logo.png" alt="Computer Geeks" class="brand-logo"></a>
    <nav class="tools">
      <a class="link" href="/admin" aria-current="page">Invoices</a>
      <a class="link" href="/admin/clients">Clients</a>
      <a class="link" href="#" id="logoutBtn">Log out</a>
    </nav>
  </div>
</header>

<main id="main" class="admin-main">
  <div class="wrap">
    <div class="admin-head">
      <h1>Invoices</h1>
      <a class="btn btn-go" href="/admin/invoice">New invoice</a>
    </div>
    <div class="admin-table">
      <table>
        <thead>
          <tr><th>Number</th><th>Client</th><th>Total</th><th>Due</th><th>Status</th></tr>
        </thead>
        <tbody id="invoiceRows"></tbody>
      </table>
      <div id="emptyState" class="empty" hidden>No invoices yet — create your first one.</div>
    </div>
  </div>
</main>

<script src="/assets/admin.js"></script>
<script>
(function () {
  var rows = document.getElementById('invoiceRows');
  var empty = document.getElementById('emptyState');

  CGAdmin.fetchAdmin('/api/admin/invoices').then(function (data) {
    var invoices = data.invoices || [];
    if (invoices.length === 0) {
      empty.hidden = false;
      return;
    }
    rows.innerHTML = invoices.map(function (inv) {
      return '<tr onclick="window.location.href=\'/admin/invoice?id=' + inv.id + '\'">' +
        '<td>' + CGAdmin.escapeHtml(inv.number) + '</td>' +
        '<td>' + CGAdmin.escapeHtml(inv.client_name) + '</td>' +
        '<td>' + CGAdmin.formatMoney(inv.total_cents, inv.currency) + '</td>' +
        '<td>' + CGAdmin.formatDate(inv.due_date) + '</td>' +
        '<td>' + CGAdmin.statusBadge(inv) + '</td>' +
        '</tr>';
    }).join('');
  }).catch(function (err) {
    empty.hidden = false;
    empty.textContent = err.message;
  });
})();
</script>
</body>
</html>
